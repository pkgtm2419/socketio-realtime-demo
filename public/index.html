<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time IoT Telemetry Streamer</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
    .card { background: #1e293b; border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; border: 1px solid #334155; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
    .metric { font-size: 1.8rem; font-weight: bold; color: #38bdf8; }
    .label { font-size: 0.85rem; color: #94a3b8; text-transform: uppercase; }
    .badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.8rem; background: #0284c7; }
    .alert-box { background: #7f1d1d; border: 1px solid #dc2626; padding: 0.75rem; border-radius: 6px; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>⚡ Real-Time IoT Telemetry Streamer</h1>
  <p>Engineered with Socket.IO, TypeScript, and bidirectional WebSocket room dispatching.</p>

  <div class="card">
    <h3>Device: <span id="deviceId" class="badge">meter-plant-01</span> <span id="latency" class="badge" style="background: #10b981; margin-left: 0.5rem;">RTT: -- ms</span></h3>
    <div class="grid">
      <div><div class="label">Voltage</div><div id="voltage" class="metric">-- V</div></div>
      <div><div class="label">Current</div><div id="current" class="metric">-- A</div></div>
      <div><div class="label">Active Power</div><div id="power" class="metric">-- kW</div></div>
      <div><div class="label">Frequency</div><div id="freq" class="metric">-- Hz</div></div>
      <div><div class="label">Temperature</div><div id="temp" class="metric">-- °C</div></div>
    </div>
    <div id="alertContainer"></div>
  </div>

  <script>
    // Demo token for viewer
    const token = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6InVzcl92aWV3ZXIiLCJlbWFpbCI6InZpZXdlckB0ZXN0LmNvbSIsInJvbGUiOiJ1c2VyIiwiaWF0IjoxNTE2MjM5MDIyfQ.DEMO';
    
    // Connect to Socket.IO with auth handshake
    const socket = io({
      auth: { token: 'demo-token' }
    });

    socket.on('connect', () => {
      console.log('Connected to real-time telemetry stream');
      socket.emit('subscribeDevice', 'meter-plant-01');
    });

    // Real-time round-trip latency heartbeat
    setInterval(() => {
      if (socket.connected) {
        const pingStart = Date.now();
        socket.emit('pingCheck', pingStart, (ack) => {
          const rtt = Date.now() - pingStart;
          const latencyEl = document.getElementById('latency');
          if (latencyEl) {
            latencyEl.innerText = `RTT: ${rtt} ms`;
            if (rtt < 50) latencyEl.style.background = '#10b981';
            else if (rtt < 150) latencyEl.style.background = '#f59e0b';
            else latencyEl.style.background = '#ef4444';
          }
        });
      }
    }, 3000);

    socket.on('telemetryStream', (data) => {
      document.getElementById('voltage').innerText = data.voltage + ' V';
      document.getElementById('current').innerText = data.current + ' A';
      document.getElementById('power').innerText = data.powerKw + ' kW';
      document.getElementById('freq').innerText = data.frequencyHz + ' Hz';
      document.getElementById('temp').innerText = data.temperatureC + ' °C';
    });

    socket.on('systemAlert', (alert) => {
      const container = document.getElementById('alertContainer');
      container.innerHTML = `<div class="alert-box"><strong>[${alert.severity}]</strong> ${alert.message}</div>`;
    });
  </script>
</body>
</html>
